<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadepad</title>
<meta name="description" content="Hide API keys, emails, phone numbers and card numbers before you paste text into an AI tool.">
<meta name="theme-color" content="#0B6E4F">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Shadepad">
<meta property="og:description" content="Hide secrets before you paste into AI. Runs in your browser.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="../">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect class="m-bg" width="64" height="64" rx="14"/><rect class="m-bar" x="14" y="18" width="36" height="6" rx="3"/><rect class="m-bar" x="14" y="30" width="22" height="6" rx="3" opacity="0.55"/><rect class="m-bar" x="14" y="42" width="30" height="6" rx="3" opacity="0.85"/></svg>
    <span class="brand-text"><span class="brand-name" data-t="brand">Shadepad</span><span class="brand-tag" data-t="app_tagline"></span></span>
  </a>
  <div class="hdr">
    <label class="sr" for="lang" data-t="set_lang">Language</label>
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option><option value="zh">中文</option><option value="es">Español</option>
    </select>
  </div>
</header>

<main id="main">
  <section class="pane" aria-labelledby="hide_h">
    <h1 class="sr" data-t="app_title">Shadepad</h1>
    <h2 id="hide_h" class="step"><span class="num" aria-hidden="true">1</span><span data-t="app_step_hide"></span></h2>
    <label for="input" data-t="app_in_label"></label>
    <textarea id="input" rows="10" spellcheck="false" data-p="app_in_ph"></textarea>

    <fieldset class="detect">
      <legend data-t="app_detect_label"></legend>
      <div id="kinds" class="kinds"></div>
      <div class="row">
        <button id="kinds_all" class="btn ghost" type="button" data-t="app_all"></button>
        <button id="kinds_none" class="btn ghost" type="button" data-t="app_none"></button>
      </div>
    </fieldset>

    <details id="custom_box" class="custom">
      <summary data-t="app_custom_title"></summary>
      <p class="muted" data-t="app_custom_hint"></p>
      <label for="custom" data-t="app_custom_label"></label>
      <textarea id="custom" rows="3" spellcheck="false"></textarea>
      <p id="custom_msg" class="warn" aria-live="polite"></p>
    </details>

    <div class="row">
      <button id="redact" class="btn" type="button" data-t="app_redact"></button>
      <button id="clear" class="btn ghost" type="button" data-t="app_clear"></button>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
    <ul id="tags" class="tags"></ul>

    <h3 id="diff_h" class="sub" data-t="app_diff_title"></h3>
    <p class="muted" data-t="app_diff_hint"></p>
    <div id="diff_wrap" hidden>
      <div id="diff" class="diff" tabindex="0" role="region" aria-labelledby="diff_h"></div>
    </div>

    <label for="output" data-t="app_out_label"></label>
    <p id="stale" class="warn" aria-live="polite" hidden></p>
    <textarea id="output" rows="10" spellcheck="false" readonly></textarea>
    <div class="row">
      <button id="copy" class="btn" type="button" data-t="app_copy_redacted"></button>
    </div>

    <section id="ai_box" class="ai" aria-labelledby="ai_h">
      <h3 id="ai_h" class="sub" data-t="ai_title"></h3>
      <p class="muted" data-t="ai_hint"></p>
      <p id="ai_local_sum" class="summary" aria-live="polite"></p>
      <ul id="ai_local" class="tags"></ul>
      <div class="row">
        <button id="ai_run" class="btn ghost" type="button" data-t="ai_run"></button>
      </div>
      <p id="ai_msg" class="summary" aria-live="polite"></p>
      <ul id="ai_items" class="tags"></ul>
      <p class="muted" data-t="ai_privacy"></p>
      <details class="ai-key">
        <summary data-t="ai_key_title"></summary>
        <p class="muted" data-t="ai_key_hint"></p>
        <label for="ai_key" data-t="ai_key_label"></label>
        <input id="ai_key" type="password" autocomplete="off" spellcheck="false">
        <div class="row">
          <button id="ai_save" class="btn ghost" type="button" data-t="ai_save"></button>
          <button id="ai_forget" class="btn ghost" type="button" data-t="ai_forget"></button>
        </div>
        <p id="ai_key_msg" class="summary" aria-live="polite"></p>
      </details>
    </section>
  </section>

  <section class="pane" aria-labelledby="restore_h">
    <h2 id="restore_h" class="step"><span class="num" aria-hidden="true">2</span><span data-t="app_restore_title"></span></h2>
    <p class="muted" data-t="app_restore_hint"></p>
    <label for="reply" data-t="app_restore_in_label"></label>
    <textarea id="reply" rows="8" spellcheck="false"></textarea>
    <div class="row">
      <button id="restore" class="btn" type="button" data-t="app_restore_btn"></button>
    </div>
    <p id="restore_msg" class="summary" aria-live="polite"></p>
    <label for="restored" data-t="app_restore_out_label"></label>
    <textarea id="restored" rows="8" spellcheck="false" readonly></textarea>
    <div class="row">
      <button id="copy_restored" class="btn ghost" type="button" data-t="app_copy_restored"></button>
    </div>
    <p class="muted" data-t="app_session_note"></p>

    <details id="backup_box" class="backup">
      <summary data-t="bk_title"></summary>
      <p class="muted" data-t="bk_hint"></p>
      <label for="pass" data-t="bk_pass"></label>
      <input id="pass" type="password" autocomplete="off" spellcheck="false">
      <div class="row">
        <button id="bk_make" class="btn" type="button" data-t="bk_make"></button>
      </div>
      <label for="backup_out" data-t="bk_out_label"></label>
      <textarea id="backup_out" rows="4" spellcheck="false" readonly></textarea>
      <div class="row">
        <button id="copy_backup" class="btn ghost" type="button" data-t="app_copy"></button>
      </div>
      <label for="backup_in" data-t="bk_in_label"></label>
      <textarea id="backup_in" rows="4" spellcheck="false"></textarea>
      <div class="row">
        <button id="bk_load" class="btn ghost" type="button" data-t="bk_load"></button>
      </div>
      <p id="bk_msg" class="summary" aria-live="polite"></p>
    </details>
  </section>
</main>

<footer class="site-foot">
  <div class="foot-brand">
    <a class="brand" href="../">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect class="m-bg" width="64" height="64" rx="14"/><rect class="m-bar" x="14" y="18" width="36" height="6" rx="3"/><rect class="m-bar" x="14" y="30" width="22" height="6" rx="3" opacity="0.55"/><rect class="m-bar" x="14" y="42" width="30" height="6" rx="3" opacity="0.85"/></svg>
      <span class="brand-name" data-t="brand">Shadepad</span>
    </a>
    <p class="foot-desc" data-t="footer_note"></p>
    <p class="foot-desc" data-t="app_footer_privacy"></p>
  </div>
  <nav class="foot-nav" aria-label="Legal">
    <a href="../privacy.html" data-t="nav_privacy">Privacy</a>
    <a href="../terms.html" data-t="nav_terms">Terms</a>
  </nav>
  <p class="foot-copy">&copy; 2026 Shadepad</p>
</footer>

<div id="gate" class="gate" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="gate_h">
    <h2 id="gate_h" data-t="gate_t"></h2>
    <p class="muted" data-t="gate_b"></p>
    <label for="key" data-t="gate_key"></label>
    <input id="key" type="text" autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="unlock" class="btn" type="button" data-t="gate_unlock"></button>
      <a id="buy" class="btn ghost" href="#" data-t="gate_buy" hidden></a>
    </div>
    <p id="gate_msg" class="summary" aria-live="polite"></p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../i18n.js"></script>
<script src="../config.js"></script>
<script src="core.js"></script>
<script src="vault.js"></script>
<script src="app.js"></script>
</body>
</html>
